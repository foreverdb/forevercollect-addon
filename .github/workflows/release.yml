name: Release

# Packages the addon and publishes a GitHub release whenever main carries a
# ForeverCollect.toc version whose tag does not exist yet. The tag is the only
# gate, so a version bump followed by more commits in the same push still
# releases. Can also be run by hand.

on:
  push:
    branches: [main]
    paths: [ForeverCollect.toc, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^## Version: *//p' ForeverCollect.toc | tr -d '\r' | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error file=ForeverCollect.toc::no '## Version:' line found"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Decide whether to release
        id: decide
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Install Lua 5.1
        if: steps.decide.outputs.release == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Check Lua syntax
        if: steps.decide.outputs.release == 'true'
        run: luac5.1 -p ForeverCollect.lua Core/*.lua Modules/*.lua

      - name: Package addon
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -rf build && mkdir -p build/ForeverCollect
          cp ForeverCollect.toc ForeverCollect.lua LICENSE README.md SCHEMA.md build/ForeverCollect/
          cp -r Core Modules build/ForeverCollect/
          (cd build && zip -qr "ForeverCollect-v$VERSION.zip" ForeverCollect)
          unzip -l "build/ForeverCollect-v$VERSION.zip"

      - name: Create release
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ForeverCollect v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: build/ForeverCollect-v${{ steps.version.outputs.version }}.zip
